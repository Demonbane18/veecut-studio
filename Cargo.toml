[workspace]
resolver = "3"
members = ["crates/veecut-engine", "crates/veecut-studio", "crates/veecut", "crates/veecut-eval"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Demonbane18/veecut-studio"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"

[profile.dev]
# Frame loops are unusably slow without optimization; keep debug builds fast to run.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
